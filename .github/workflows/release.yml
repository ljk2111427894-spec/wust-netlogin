name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray Pillow pywin32

      - name: Compile Main Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --hidden-import=pystray --hidden-import=PIL --name "CampusNetLogin" main.py
          Move-Item -Path "dist\CampusNetLogin.exe" -Destination ".\CampusNetLogin.exe" -Force

      - name: Generate Release Packages
        run: |
          python build_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
